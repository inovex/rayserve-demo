# This file was generated using the `serve build` command on Ray v2.53.0.

proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

grpc_options:
  port: 9000
  grpc_servicer_functions: []

logging_config:
  encoding: TEXT
  log_level: INFO
  logs_dir: null
  enable_access_log: true
  additional_log_standard_attrs: []

applications:
- name: rayerve_demo
  route_prefix: /
  import_path: serve_model:iris_app
  runtime_env: {}
  deployments:
  - name: DataAuditor
    ray_actor_options:
      num_cpus: 0.2
  - name: IrisPredictor
    autoscaling_config:
      min_replicas: 1
      initial_replicas: 1
      max_replicas: 10
      target_ongoing_requests: 5.0
      metrics_interval_s: 10.0
      look_back_period_s: 30.0
      smoothing_factor: 1.0
      upscale_smoothing_factor: null
      downscale_smoothing_factor: null
      upscaling_factor: null
      downscaling_factor: null
      downscale_delay_s: 600.0
      downscale_to_zero_delay_s: null
      upscale_delay_s: 30.0
      aggregation_function: mean
      policy:
        policy_function: ray.serve.autoscaling_policy:default_autoscaling_policy
    health_check_period_s: 10.0
    health_check_timeout_s: 30.0
    ray_actor_options:
      num_cpus: 0.5
